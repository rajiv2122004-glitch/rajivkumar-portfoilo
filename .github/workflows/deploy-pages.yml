name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck and Lint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      # Primary Deployment: Push production bundle to gh-pages branch (works automatically on all repositories)
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      # Secondary Deployment: Also trigger GitHub Actions Pages deployment if enabled
      - name: Setup Pages with auto-enablement
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Actions Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
